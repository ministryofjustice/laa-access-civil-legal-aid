name: Build and Push image
on:
  workflow_call:
    inputs:
      ACCESS_ECR_REGION:
        required: true
        type: string
      ACCESS_ECR_REPOSITORY:
        required: true
        type: string
    secrets:
      ACCESS_ECR_ROLE_TO_ASSUME:
        required: true
    outputs:
      image_uri:
        description: "Full URI of the image pushed to ECR"
        value: ${{ jobs.build-and-push-to-ecr.outputs.image_uri }}


jobs:
  build-and-push-to-ecr:
    name: Build and Push
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.meta.outputs.tags }}
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read  # This is required for actions/checkout
    steps:
      - name: Checkout GitHub repository 
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assume role in Cloud Platform
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.ACCESS_ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.ACCESS_ECR_REGION }}

      - name: Login to container repository
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        id: login-ecr
        with:
          mask-password: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ACCESS_ECR_REPOSITORY }}
          tags: |
            type=sha,format=long,prefix=,suffix=

      - name: Build and push a Docker image to the container repository
        id: docker-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags:  ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production
